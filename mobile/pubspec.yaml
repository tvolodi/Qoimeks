name: qoimeks
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  http: ^1.6.0
  mobile_scanner: ^7.0.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.6
  record: ^6.2.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.0
  uuid: ^4.6.0
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Variable fonts (SIL OFL 1.1, licence texts next to the files). The same file is
    # declared per weight so that FontWeight w400/w500/w600 select the wght axis.
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 400
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 500
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 600
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 600
